<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FRC Scouting app for the 2026 REBUILT game season.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FRC Scout">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FRC Scouting</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Force-update mechanism for PWA.
    // On each load, fetch version.json from the server (cache-busted).
    // If the version has changed, clear all caches & service workers and hard-reload.
    // If the server is unreachable, fall back gracefully and load normally.
    (function() {
      var STORAGE_KEY = 'app_version';

      function clearAllCaches() {
        if ('caches' in window) {
          return caches.keys().then(function(names) {
            return Promise.all(names.map(function(name) {
              return caches.delete(name);
            }));
          });
        }
        return Promise.resolve();
      }

      function unregisterServiceWorkers() {
        if ('serviceWorker' in navigator) {
          return navigator.serviceWorker.getRegistrations().then(function(registrations) {
            return Promise.all(registrations.map(function(r) {
              return r.unregister();
            }));
          });
        }
        return Promise.resolve();
      }

      function checkForUpdate() {
        var url = 'version.json?_t=' + Date.now();
        return fetch(url, { cache: 'no-store' })
          .then(function(response) {
            if (!response.ok) throw new Error('version.json not found');
            return response.json();
          })
          .then(function(data) {
            var serverVersion = data.version;
            var localVersion = localStorage.getItem(STORAGE_KEY);

            if (localVersion && localVersion !== serverVersion) {
              console.log('[Update] New version detected: ' + serverVersion + ' (was ' + localVersion + '). Forcing update...');
              localStorage.setItem(STORAGE_KEY, serverVersion);
              return Promise.all([clearAllCaches(), unregisterServiceWorkers()])
                .then(function() {
                  window.location.reload();
                });
            } else {
              if (!localVersion) {
                console.log('[Update] First visit. Storing version: ' + serverVersion);
              } else {
                console.log('[Update] App is up to date (v' + serverVersion + ').');
              }
              localStorage.setItem(STORAGE_KEY, serverVersion);
            }
          })
          .catch(function(err) {
            console.warn('[Update] Could not check for updates, loading cached version.', err);
          });
      }

      checkForUpdate();
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
